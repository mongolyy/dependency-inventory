name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # shellcheck と jq は ubuntu-latest に最初から入っている
      - name: shellcheck
        run: shellcheck collect-deps.sh test/bin/gh

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: bats
        run: bats test/
