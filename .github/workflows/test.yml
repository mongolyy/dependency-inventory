name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # shellcheck と jq は ubuntu-latest に最初から入っている
      - name: shellcheck
        run: shellcheck collect-deps.sh test/bin/gh

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: bats
        run: bats test/
